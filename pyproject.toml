[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "transfermarkt-scraper"
version = "0.1.0"
description = "Scrape Transfermarkt with Python: every club in a league, every player in a squad with market value, contract, nationality and transfer fee, and player profiles."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Buğrahan Saka" }]
keywords = ["transfermarkt", "football", "soccer", "market value", "squads", "transfers", "premier league", "web scraping", "scraper", "scrapedo"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = ["requests>=2.25"]

[project.urls]
Homepage = "https://github.com/bugrahansss/transfermarkt-scraper"
Source = "https://github.com/bugrahansss/transfermarkt-scraper"
Issues = "https://github.com/bugrahansss/transfermarkt-scraper/issues"

[project.scripts]
transfermarkt-scraper = "transfermarkt_scraper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
